name: Deploy to Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Validate clasp credentials
        run: |
          node -e "const fs=require('fs'); const p=process.env.HOME+'/.clasprc.json'; const s=fs.readFileSync(p,'utf8'); const j=JSON.parse(s); if(!j.token && !j.tokens){console.error('Missing token/tokens in CLASPRC_JSON'); process.exit(1);} let t=j.token||j.tokens; if(Array.isArray(t)) t=t[0]; if(!(t.access_token||t.refresh_token)){console.error('Missing access_token/refresh_token'); process.exit(1);} console.log('CLASPRC_JSON OK')"

      - name: Push to Apps Script
        run: clasp push --force

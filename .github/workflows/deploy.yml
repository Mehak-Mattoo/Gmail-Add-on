name: Deploy to Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Validate clasp credentials
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.HOME + '/.clasprc.json', 'utf8');
            const j = JSON.parse(raw);
            const token = j.tokens && j.tokens.default;
            if (!token || !token.refresh_token) {
              console.error('No refresh_token found in CLASPRC_JSON');
              process.exit(1);
            }
            console.log('CLASPRC_JSON OK');
          "

      - name: Push to Apps Script
        run: clasp push --force